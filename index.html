<style>
:root{
  --ink:#3a2a1c; --ink-soft:#8b6a50; --cream:#fff9ef; --honey:#ffe6b4; --honey-deep:#ffd07a;

}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
[hidden]{display:none !important}
html,body{margin:0;padding:0;min-height:100%}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Malgun Gothic","Noto Sans KR",system-ui,"Segoe UI",sans-serif;
  color:var(--ink);-webkit-text-size-adjust:100%;overflow-x:hidden;touch-action:manipulation;
  background:
    radial-gradient(720px 360px at 50% -6%, #ffffff 0%, rgba(255,255,255,0) 62%),

    radial-gradient(520px 320px at -8% 24%, rgba(255,226,178,.6) 0%, rgba(255,226,178,0) 74%),
    linear-gradient(180deg,#fff9ef 0%, #fff3dd 54%, #fff9ef 100%);
}
button{font-family:inherit;cursor:pointer}
.app{
  position:relative;z-index:1;max-width:480px;margin:0 auto;
  padding:calc(5px + env(safe-area-inset-top)) 12px calc(84px + env(safe-area-inset-bottom));
  min-height:100vh;min-height:100dvh;display:flex;flex-direction:column;justify-content:center;
}
/* ---------- top bar ---------- */
.topbar{display:flex;align-items:center;gap:5px;padding:2px 0 6px}
.topbar h1{
  margin:0;flex:1 1 auto;min-width:0;text-align:center;white-space:nowrap;
  font-size:clamp(18px,5.6vw,24px);font-weight:900;line-height:1.2;letter-spacing:-.055em;
  color:#b5670d;text-shadow:0 1px 0 #fff,0 2px 0 rgba(255,255,255,.9),0 6px 14px rgba(232,137,26,.26);
}
.topbar h1 .emo{font-size:.92em;padding-right:.1em;filter:drop-shadow(0 2px 2px rgba(0,0,0,.14))}
.iconbtn{
  width:34px;height:34px;flex:0 0 auto;border-radius:11px;border:none;background:#fffdf7;
  box-shadow:0 3px 10px rgba(180,120,40,.20);color:#c07a14;display:grid;place-items:center;padding:0;
}
.iconbtn:active{transform:translateY(1px)}
.iconbtn.off{color:#bfae96}
.iconbtn svg{width:18px;height:18px;display:block}
/* ---------- hud ---------- */
.hud{display:flex;gap:5px;margin:1px 0 6px}
.hudCell{
  flex:1 1 0;min-width:0;background:#fffdf7;border:1.5px solid var(--line);border-radius:12px;
  padding:4px 3px 5px;text-align:center;box-shadow:0 3px 9px rgba(170,120,50,.10);
}
.hudK{display:block;font-size:10px;font-weight:800;color:var(--ink-soft);letter-spacing:-.03em}
.hudCell b{display:block;font-size:15px;font-weight:900;color:#a85f06;letter-spacing:-.05em;margin-top:1px;white-space:nowrap}
.hudCell b.hot{color:#e0451f}
.hudCell.time b{color:#c2451f}
/* ---------- mascot row ---------- */
.stageRow{display:flex;align-items:flex-end;gap:3px;margin:0 0 5px}
.bubble{
  flex:1 1 auto;min-width:0;position:relative;background:#fffdf7;border:2px solid #ffe0ad;
  border-radius:13px;padding:7px 10px;font-size:12px;font-weight:800;line-height:1.34;
  color:#8a5410;letter-spacing:-.035em;box-shadow:0 4px 10px rgba(190,140,60,.14);
  margin:0 0 6px 0;min-height:32px;
}
.bubble::after{
  content:"";position:absolute;right:-6px;bottom:11px;width:9px;height:9px;background:#fffdf7;
  transform:rotate(45deg);border-right:2px solid #ffe0ad;border-top:2px solid #ffe0ad;
}
.mascot{flex:0 0 auto;display:block;overflow:visible}
.mascot.flame{width:52px;height:58px}
.mascot.friend{width:50px;height:56px;margin-bottom:3px}
.mascot .face{display:none}
[data-mood="idle"] .face-idle{display:block}
[data-mood="cheer"] .face-cheer{display:block}
[data-mood="warn"] .face-warn{display:block}
[data-mood="sad"] .face-sad{display:block}
/* ---------- grill ---------- */
.grillHead{display:flex;align-items:center;justify-content:space-between;gap:6px;margin:0 2px 4px;font-size:11px;font-weight:900;letter-spacing:-.03em}
.grillHead #levelTag{color:#9a6a24}
.grillHead #goalTag{color:#c2451f;background:#fff1d6;border:1.5px solid #ffd79a;border-radius:99px;padding:2px 8px}
.grill{
  position:relative;border-radius:24px;padding:9px 9px 10px;
  background:linear-gradient(180deg,#3b2f27 0%,#2a221e 52%,#1d1713 100%);
  box-shadow:inset 0 2px 0 rgba(255,210,150,.10),0 14px 26px rgba(70,40,10,.30),0 2px 0 #4a3a2e;
  border:2px solid #1a1411;
}
.grill::before{
  content:"";position:absolute;inset:auto 12px 4px 12px;height:40px;border-radius:50%;
  background:radial-gradient(closest-side,rgba(255,110,50,.55),rgba(255,110,50,0));
  filter:blur(2px);pointer-events:none;
}
.grill::after{
  content:"";position:absolute;inset:0;border-radius:22px;pointer-events:none;
  box-shadow:inset 0 0 30px rgba(0,0,0,.55);
}
.slots{position:relative;z-index:1;display:grid;gap:7px}.slots.n1 .slot{min-height:150px;max-height:214px}
.slots.n2 .slot{min-height:118px;max-height:164px}
.slots.n3 .slot{min-height:104px;max-height:136px}
.slots.n4 .slot{min-height:94px;max-height:122px}
.slot{
  position:relative;border-radius:15px;overflow:hidden;min-height:74px;
  border:1.5px solid rgba(255,190,120,.16);
  background:
    repeating-linear-gradient(90deg,rgba(255,255,255,.055) 0 3px,rgba(0,0,0,0) 3px 17px),
    radial-gradient(120% 90% at 50% 118%,rgba(255,116,50,.42) 0%,rgba(255,116,50,0) 66%),
    linear-gradient(180deg,#241d19,#302620);
  transition:box-shadow .15s ease,border-color .15s ease;
}
.slot.empty{opacity:.55}
.slot.empty::after{
  content:"다음 고기 준비 중…";position:absolute;inset:0;display:grid;place-items:center;
  font-size:11px;font-weight:800;color:rgba(255,214,160,.5);letter-spacing:-.02em;
}
.slot.ready{border-color:rgba(255,212,94,.85);box-shadow:0 0 0 2px rgba(255,212,94,.28),0 0 18px rgba(255,190,60,.35) inset}
.slot.danger{border-color:rgba(255,90,50,.9);animation:dangerPulse 1s ease-in-out infinite}
@keyframes dangerPulse{0%,100%{box-shadow:0 0 0 0 rgba(255,90,50,.0)}50%{box-shadow:0 0 14px rgba(255,90,50,.55)}}
.slot.serving{border-color:rgba(120,220,160,.8)}
.slot.burnt{border-color:rgba(120,110,100,.7)}
.meatSvg{display:block;width:100%;height:100%;position:absolute;inset:0}
.slot .meatSvg .meatBase{transition:fill .12s linear}
.slot .fat,.slot .fatCap{fill:none;stroke-linecap:round}
.slot .marble,.slot .juice,.slot .marks,.slot .chars,.slot .crust{transition:opacity .18s linear}
.slot .pieces{display:none}
.slot.serving .pieces{display:block}
.slot.serving .meatBase,.slot.serving .fat,.slot.serving .fatCap,.slot.serving .marble,.slot.serving .marks,.slot.serving .chars,.slot.serving .crust,.slot.serving .rim,.slot.serving .juice{display:none}
.slot.serving .piece{animation:piecePop .55s cubic-bezier(.2,1.4,.5,1) both}
@keyframes piecePop{0%{transform:translateY(0) scale(1)}45%{transform:translateY(-6px) scale(1.06)}100%{transform:translateY(-14px) scale(.94);opacity:.85}}
.startMask{
  position:absolute;inset:8px;z-index:5;border-radius:16px;display:grid;place-items:center;align-content:center;gap:3px;
  background:linear-gradient(180deg,rgba(24,17,13,.78),rgba(24,17,13,.9));backdrop-filter:blur(2px);
  border:1.5px solid rgba(255,212,94,.45);text-align:center;padding:8px;
}
.startMask b{font-size:17px;font-weight:900;color:#ffd75e;letter-spacing:-.04em;text-shadow:0 2px 6px rgba(0,0,0,.5);animation:readyPop 1.4s ease-in-out infinite}
.startMask span{font-size:11px;font-weight:800;color:#ffdca8;letter-spacing:-.03em;opacity:.9}
.slot .tag{
  position:absolute;left:6px;top:5px;z-index:3;background:rgba(24,18,14,.82);
  border:1.5px solid rgba(255,200,120,.5);border-radius:99px;padding:1px 7px;
  font-size:9.5px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;
}
.slot .hint{
  position:absolute;right:6px;bottom:5px;z-index:3;border-radius:99px;padding:2px 8px;
  font-size:10.5px;font-weight:900;letter-spacing:-.03em;white-space:nowrap;
  background:rgba(24,18,14,.72);color:#ffd89a;border:1.5px solid rgba(255,255,255,.14);
}
.slot .hint.ready{background:linear-gradient(180deg,#ffd75e,#f5a814);color:#5a3200;border-color:#fff0b8;animation:readyPop .9s ease-in-out infinite}
.slot .hint.danger{background:linear-gradient(180deg,#ff8a5c,#e0451f);color:#fff;border-color:#ffc3ab;animation:dangerPulse .9s ease-in-out infinite}
.slot .hint.served{background:linear-gradient(180deg,#7fe0a8,#2f9e6b);color:#06381f;border-color:#c9f5db}
.slot .hint.burnt{background:#20140f;color:#ff9a7a;border-color:#5a3a2c}
@keyframes readyPop{0%,100%{transform:scale(1)}50%{transform:scale(1.07)}}
.slot .gauge{position:absolute;left:9px;right:9px;bottom:3px;height:9px;z-index:2;border-radius:99px;background:rgba(255,255,255,.13);overflow:hidden}
.slot .gauge .bar{position:absolute;left:0;top:0;bottom:0;border-radius:99px;background:#e29a55}
.slot .gauge .zone{position:absolute;top:0;bottom:0;z-index:2;border-radius:99px;background:rgba(255,212,94,.26);border:1.5px solid #ffd45e;box-shadow:0 0 7px rgba(255,212,94,.75)}
.slot .spark{position:absolute;right:8px;top:6px;z-index:3;font-size:16px;animation:sparkBounce .8s ease-in-out infinite}
.slot .spark::after{content:"";position:absolute;inset:-6px;border-radius:50%;border:2px solid rgba(255,212,94,.6);animation:sparkRing 1s ease-out infinite}
@keyframes sparkBounce{0%,100%{transform:translateY(0) rotate(-6deg)}50%{transform:translateY(-4px) rotate(8deg)}}
@keyframes sparkRing{0%{transform:scale(.6);opacity:.9}100%{transform:scale(1.5);opacity:0}}
.slot .smoke{position:absolute;left:50%;top:8%;z-index:4;font-size:22px;transform:translateX(-50%);animation:smokeUp 1s ease-out infinite}
@keyframes smokeUp{0%{opacity:.9;transform:translate(-50%,0) scale(.8)}100%{opacity:0;transform:translate(-50%,-14px) scale(1.5)}}
.float{position:absolute;z-index:6;left:50%;top:40%;transform:translate(-50%,0);font-size:15px;font-weight:900;color:#ffd45e;text-shadow:0 2px 4px rgba(0,0,0,.5);animation:floatUp .9s ease-out both;pointer-events:none;white-space:nowrap}
@keyframes floatUp{0%{opacity:0;transform:translate(-50%,6px) scale(.8)}25%{opacity:1}100%{opacity:0;transform:translate(-50%,-26px) scale(1.05)}}
/* ---------- action ---------- */
.cutBtn{
  display:block;width:100%;margin-top:9px;border:none;border-radius:16px;padding:13px 10px;
  font-size:17px;font-weight:900;letter-spacing:-.045em;color:#4a2a00;
  background:linear-gradient(180deg,#ffe07a 0%,#ffb02e 58%,#e8891a 100%);
  box-shadow:0 6px 0 #b5670d,0 10px 20px rgba(200,130,20,.32);
  transition:transform .08s ease,box-shadow .08s ease;
}
.cutBtn svg{width:19px;height:19px;display:inline-block;vertical-align:-3px;margin-right:3px}
.cutBtn:active{transform:translateY(3px);box-shadow:0 3px 0 #b5670d,0 6px 12px rgba(200,130,20,.28)}
.cutBtn[disabled]{opacity:.5}
.cutBtn small{display:block;font-size:10.5px;font-weight:800;letter-spacing:-.02em;opacity:.72;margin-top:1px}
.legend{display:flex;align-items:center;justify-content:center;gap:5px;margin-top:6px;font-size:9.5px;font-weight:800;color:#a08153;letter-spacing:-.03em}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px}
/* ---------- result / pause overlays ---------- */
.overlay{
  position:fixed;inset:0;z-index:30;display:flex;align-items:center;justify-content:center;
  padding:16px;background:rgba(28,20,14,.55);backdrop-filter:blur(3px);
  animation:fadeIn .2s ease-out both;
}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.resCard{
  width:100%;max-width:400px;max-height:92vh;overflow-y:auto;background:#fffdf7;
  border:2px solid #ffd79a;border-radius:22px;padding:14px 14px 15px;
  box-shadow:0 16px 40px rgba(40,24,8,.4);
}
.resTop{text-align:center;font-size:12px;font-weight:900;color:#b5762a;letter-spacing:.02em}

.resStars .on{color:#ffb019;text-shadow:0 2px 0 #fff,0 4px 10px rgba(255,176,25,.45)}
.resGrade{text-align:center;font-size:19px;font-weight:900;color:#a85f06;letter-spacing:-.05em;margin-top:2px}
.resScore{text-align:center;margin:4px 0 1px}
.resScore b{font-size:34px;font-weight:900;color:#d9551a;letter-spacing:-.05em}
.resScore span{font-size:13px;font-weight:900;color:#a86530;margin-left:2px}
.resBest{text-align:center;font-size:11.5px;font-weight:800;color:#9a7448;min-height:15px}
.resBest.new{color:#0f8a5b}
.resRows{margin:8px 0 0;border-top:1.5px dashed #f0e0c6;padding-top:6px}
.rRow{display:flex;align-items:center;gap:7px;padding:4px 0;font-size:12.5px;font-weight:700;color:#7a5a3a}
.rRow i{flex:0 0 16px;font-style:normal;font-weight:900;color:#c09050;font-size:11px}
.rRow .nm{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;letter-spacing:-.03em}
.rRow .er{flex:0 0 auto;font-weight:900;color:#8a5a2a}
.rRow .pt{flex:0 0 46px;text-align:right;font-weight:900;color:#0f8a5b}
.resBtns{display:flex;gap:8px;margin-top:11px}
.btn{
  flex:1 1 0;border:none;border-radius:14px;padding:12px 8px;font-size:14px;font-weight:900;letter-spacing:-.04em;
  color:#4a2a00;background:linear-gradient(180deg,#ffe07a,#ffb02e);box-shadow:0 5px 0 #b5670d;
}
.btn:active{transform:translateY(2px);box-shadow:0 3px 0 #b5670d}
.btn.ghost{background:#fff6e4;color:#a86514;box-shadow:0 5px 0 #f0dfc2;border:1.5px solid #ffd79a}
.btn.wide{display:block;width:100%;margin-top:8px}
.pauseCard{
  width:100%;max-width:330px;background:#fffdf7;border:2px solid #ffd79a;border-radius:22px;
  padding:20px 16px 16px;text-align:center;box-shadow:0 16px 40px rgba(40,24,8,.4);
}
.pauseCard .pEmo{font-size:38px;line-height:1}
.pauseCard .pTitle{font-size:18px;font-weight:900;color:#a85f06;margin-top:4px;letter-spacing:-.05em}
.pauseCard .pSub{font-size:12px;font-weight:700;color:#9a7448;margin:4px 0 12px}
/* ---------- tabs ---------- */
.tabbar{
  position:fixed;left:0;right:0;bottom:0;z-index:20;display:flex;gap:2px;
  padding:5px 5px calc(5px + env(safe-area-inset-bottom));
  background:linear-gradient(180deg,rgba(255,249,239,.94),#fff6e6 44%,#ffeed3);
  border-top:2px solid #ffdfae;box-shadow:0 -6px 18px rgba(170,120,50,.16);
}
.tab{
  flex:1 1 0;min-width:0;border:none;background:transparent;border-radius:11px;padding:4px 1px 3px;
  display:flex;flex-direction:column;align-items:center;gap:1px;color:#b59267;
}
.tab b{font-size:14px;font-weight:900;line-height:1;letter-spacing:-.04em}
.tab span{font-size:9px;font-weight:800;letter-spacing:-.05em;white-space:nowrap}
.tab .mark{font-style:normal;font-size:8px;height:9px;line-height:9px;color:#e29100}
.tab.active{background:linear-gradient(180deg,#fff0cf,#ffe0a6);color:#a85f06;box-shadow:inset 0 0 0 1.5px #ffcf87}
.tab.active b{color:#b5670d}
/* ---------- toast ---------- */
.toast{
  position:fixed;left:50%;bottom:calc(78px + env(safe-area-inset-bottom));transform:translateX(-50%);
  z-index:40;max-width:86vw;background:rgba(42,28,18,.95);color:#ffe6b4;font-size:12.5px;font-weight:800;
  padding:9px 14px;border-radius:99px;box-shadow:0 8px 20px rgba(42,28,18,.35);text-align:center;
  border:1.5px solid rgba(255,190,110,.35);
}
.toast.bad{background:rgba(150,45,20,.96);color:#ffe0d2;border-color:rgba(255,150,120,.5)}
@media (max-height:730px){
  .mascot.flame{width:44px;height:50px}
  .mascot.friend{width:42px;height:48px}
  .slots.n1 .slot{min-height:112px;max-height:150px}

  .cutBtn{padding:11px 8px;font-size:16px}
  .bubble{font-size:11.5px;padding:5px 8px;min-height:28px}
}
@media (prefers-reduced-motion:reduce){
  *{animation-duration:.001s !important;transition-duration:.001s !important}
}
</style>
</head>

    return {
      title: TITLE,
      text: '숯불 불판 위 삼겹살을 노릇노릇 굽고 싹둑 자르는 게임! 내 최고 점수는 ' + fmt(bestTotal()) + '점이에요.',
      url: (typeof location !== 'undefined' && location.href ? location.href.split('#')[0] : '')
    };
  }
  function copyLink(url) {
    function done(ok) {
      toast(ok ? '링크를 복사했어요! 친구에게 붙여넣기 해 주세요.' : '주소창의 주소를 복사해 주세요');
    }
    function fallback() {
      var ta = document.createElement('textarea'), ok = false;
      ta.value = url;
      ta.setAttribute('readonly', 'readonly');
      ta.style.position = 'fixed';
      ta.style.top = '-1000px';
      document.body.appendChild(ta);
      if (ta.select) { ta.select(); }
      try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
      document.body.removeChild(ta);
      done(ok);
    }
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(url).then(function () { done(true); }, fallback);
        return;
      }
    } catch (e) {}
    fallback();
  }
  function shareGame() {
    var p = sharePayload();
    if (navigator.share) {
      try {
        navigator.share(p)['catch'](function () { copyLink(p.url); });
        return true;
      } catch (e) {}
    }
    copyLink(p.url);
    return false;
  }

  /* ---------- manifest (PWA, inline so the file stays single) ---------- */
  function setupManifest() {
    var link = $('manifestLink');
    var icon = document.querySelector ? document.querySelector('link[rel="apple-touch-icon"]') : null;
    var href = icon ? icon.getAttribute('href') : '';
    var mf = {
      name: TITLE, short_name: '불판왕',
      description: '숯불 불판 위 삼겹살을 노릇노릇 굽고 싹둑 자르는 불판 게임',
      start_url: '.', scope: '.', display: 'standalone', orientation: 'portrait',
      background_color: '#fff9ef', theme_color: '#2a221e',
      icons: [{ src: href, sizes: '512x512', type: 'image/svg+xml', purpose: 'any maskable' }]
    };
    try {
      link.setAttribute('href', 'data:application/manifest+json;charset=utf-8,' + encodeURIComponent(JSON.stringify(mf)));
    } catch (e) {}
  }

  function applyMute() {
    $('sndOnIcon').style.display = save.muted ? 'none' : '';
    $('sndOffIcon').style.display = save.muted ? '' : 'none';
    $('sndBtn').className = 'iconbtn' + (save.muted ? ' off' : '');
    $('sndBtn').setAttribute('aria-label', save.muted ? '효과음 켜기' : '효과음 끄기');
  }

  /* ---------- events ---------- */
  function bind() {
    $('cutBtn').addEventListener('click', function () { cutFront(); paintAll(); renderHud(); });
    if ($('startMask')) {
      $('startMask').addEventListener('click', function () {
        audioUnlocked = true;
        sfx('tap');
        begin();
        paintAll();
        renderHud();
      });
    }
    $('pauseBtn').addEventListener('click', function () { audioUnlocked = true; sfx('tap'); pause(); });
    $('resumeBtn').addEventListener('click', function () { audioUnlocked = true; sfx('tap'); resume(); });
    $('restartBtn').addEventListener('click', function () { audioUnlocked = true; sfx('tap'); startLevel(S.level); });
    $('restartBtn2').addEventListener('click', function () { audioUnlocked = true; sfx('tap'); startLevel(S.level); });
    $('retryBtn').addEventListener('click', function () { sfx('tap'); startLevel(S.level); });
    $('nextLevelBtn').addEventListener('click', function () {
      sfx('tap');
      startLevel(Math.min(LEVELS.length, S.level + 1));
    });
    $('shareBtn').addEventListener('click', shareGame);
    $('sndBtn').addEventListener('click', function () {
      audioUnlocked = true;
      save.muted = !save.muted;
      writeStore();
      applyMute();
      toast(save.muted ? '효과음을 껐어요' : '효과음을 켰어요');
      if (!save.muted) { sfx('tap'); }
    });
    document.addEventListener('keydown', function (e) {
      if (!e || !e.key) { return; }
      var k = e.key;
      if (k === 'Escape') { if (S.phase === 'play') { pause(); } else if (S.phase === 'paused') { resume(); } return; }
      if (k === ' ' || k === 'Spacebar' || k === 'Enter') {
        audioUnlocked = true;
        if (S.phase === 'play') { cutFront(); paintAll(); renderHud(); }
        else if (S.phase === 'paused') { resume(); }
        if (e.preventDefault) { e.preventDefault(); }
        return;
      }
      var n = parseInt(k, 10);
      if (n >= 1 && n <= S.slots.length && S.phase === 'play') { tapSlot(n - 1); paintAll(); renderHud(); }
    });
    document.addEventListener('pointerdown', function () { audioUnlocked = true; }, { once: true });
  }

  var lastT = 0;
  function loop() {
    var now = (typeof Date !== 'undefined' && Date.now) ? Date.now() : 0;
    var dt = lastT ? (now - lastT) : TICK_MS;
    lastT = now;
    tick(dt);
  }

  function init() {
    var stored = readStore();
    save.best = stored.best || {};
    save.muted = !!stored.muted;
    save.lastLevel = stored.lastLevel || 1;
    if (save.lastLevel < 1 || save.lastLevel > LEVELS.length) { save.lastLevel = 1; }
    seedRng(((typeof Date !== 'undefined' ? Date.now() : 1) ^ Math.floor(Math.random() * 4294967296)) >>> 0);
    applyMute();
    renderTabs();
    bind();
    setupManifest();
    startLevel(save.lastLevel);
    if (typeof setInterval === 'function') { setInterval(loop, TICK_MS); }
  }

  /* ---------- test hook ---------- */
  window.__bulpan = {
    LEVELS: LEVELS, KINDS: KINDS, ORDERS: ORDERS, state: S, save: save, TITLE: TITLE,
    RAW_END: RAW_END, GOLD_IN: GOLD_IN, GOLD_OUT: GOLD_OUT, BURN_AT: BURN_AT, WELL_HI: WELL_HI,
    BASE_SEC: BASE_SEC, PIECES: PIECES, REFILL_MS: REFILL_MS, SERVE_MS: SERVE_MS, TICK_MS: TICK_MS,
    setSeed: seedRng, rnd: rnd,
    stateOf: stateOf, windowOf: windowOf, quality: quality,
    meatColor: meatColor, judge: judge, starsFor: starsFor, gradeFor: gradeFor, comboBonus: comboBonus,
    startLevel: startLevel, tick: tick, pause: pause, resume: resume, finish: finish, begin: begin,
    flipSlot: flipSlot, cutSlot: cutSlot, tapSlot: tapSlot, cutFront: cutFront, bestSlot: bestSlot,
    spawn: spawn, burn: burn, serve: serve, updateMood: updateMood,
    sharePayload: sharePayload, setMood: setMood, hintFor: hintFor, wantMore: wantMore,
    tabs: function () { return S.tabEls || []; }
  };

  if (document.readyState === 'loading') {
    document.addEventListener('DOMContentLoaded', init);
  } else {
    init();
  }
})();
</script>
</body>
</html>
